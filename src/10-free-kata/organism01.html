<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Animación p5.js</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <script>
    a=(y,d=mag(k=(4+cos(i/9-t*2))*cos(i/35),e=y/7-13)+sin(e/9+t/2)-4)=>point((q=2*sin(k*3)-y/35*k*(9+k*sin(cos(e)*9-d*2+t)))+40*cos(c=d-t)+200,q*sin(c)+d*35)

    t=0

    draw=$=>{
      t||createCanvas(w=400,w)
      background(9).stroke(w,96)

      for(t+=PI/80,i=1e4;i--;)
        a(i/235)
    }
  </script>
</body>
</html>
